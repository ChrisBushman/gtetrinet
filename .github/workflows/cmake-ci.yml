name: CMake CI

# Builds the current SDL2 port (the CMakeLists.txt target -- "modern
# macOS / generic Unix with pkg-config-discoverable deps") on Linux, so
# a plain push is checked against the build the project actually uses.
# The native PPC-Tiger / IRIX Makefiles and the Windows release workflow
# cover the other targets.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake pkg-config build-essential \
          libglib2.0-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel
